# Single source of truth for all dependency, plugin, tooling, and submodule versions.
#
# The project version is NOT defined here: JReleaser derives it from the git tag
# at release time; local builds fall back to the value in each module's build script.

[versions]
kotlin = "2.4.10"
kotlinx-html = "0.12.0"
ktor = "3.5.2"
logback = "1.6.1"
jreleaser = "1.25.0"
kover = "0.9.9"

# Codegen submodule tags (drive `git checkout` of the daisyui/heroicons submodules).
# daisyui must stay at a version that also has a published webjar (see webjar-daisyui
# library below), so generated components never reference CSS absent from the webjar.
daisyui = "5.7.0"
heroicons = "2.2.0"

# DaisyUI 5 is a Tailwind v4 plugin; this is the exact tailwind version the pinned
# daisyui release was built against, so the two are known-compatible.
webjar-tailwindcss-browser = "4.3.2"
webjar-htmx = "2.0.10"

# E2E test stack
playwright = "1.61.0"
kotest = "6.2.3"
cucumber = "7.34.6"
junit-platform = "6.1.2"

[libraries]
kotlinx-html-jvm = { module = "org.jetbrains.kotlinx:kotlinx-html-jvm", version.ref = "kotlinx-html" }

# Ktor server
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-html-builder = { module = "io.ktor:ktor-server-html-builder", version.ref = "ktor" }
ktor-server-webjars = { module = "io.ktor:ktor-server-webjars", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-resources = { module = "io.ktor:ktor-server-resources", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

# Logging
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# WebJars
webjar-daisyui = { module = "org.webjars.npm:daisyui", version.ref = "daisyui" }
webjar-tailwindcss-browser = { module = "org.webjars.npm:tailwindcss__browser", version.ref = "webjar-tailwindcss-browser" }
webjar-htmx = { module = "org.webjars.npm:htmx.org", version.ref = "webjar-htmx" }

# E2E test stack
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
cucumber-java = { module = "io.cucumber:cucumber-java", version.ref = "cucumber" }
cucumber-junit-platform-engine = { module = "io.cucumber:cucumber-junit-platform-engine", version.ref = "cucumber" }
cucumber-picocontainer = { module = "io.cucumber:cucumber-picocontainer", version.ref = "cucumber" }
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite", version.ref = "junit-platform" }
junit-platform-suite-engine = { module = "org.junit.platform:junit-platform-suite-engine", version.ref = "junit-platform" }

[bundles]
ktor-server-app = [
    "ktor-server-core",
    "ktor-server-netty",
    "ktor-server-html-builder",
    "ktor-server-webjars",
    "ktor-server-status-pages",
    "ktor-server-resources",
]
webjars = [
    "webjar-daisyui",
    "webjar-tailwindcss-browser",
    "webjar-htmx",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
