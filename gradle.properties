# Dependency, plugin, tooling, and submodule versions live in gradle/libs.versions.toml.
#
# This is the version for LOCAL builds and publishToMavenLocal, and the intent for the next
# release. It does NOT drive a release: .github/workflows/release.yml triggers on a v* tag
# and passes -Pversion derived from that tag name, which overrides this value. The tag is the
# source of truth, this line is the declaration of intent — which is why v0.1.1 and v0.1.2
# shipped while this file still read 0.1.0.
#
# 0.6.0 is the largest API change the library has made, and unlike 0.5.0 every part of it
# breaks at COMPILE TIME. Where a browser confirmed that two of a component's classes cannot
# both take effect, the booleans became one enum parameter: 14 groups became one enum each,
# four placement groups split into two independent axes, and five booleans were renamed
# because the class name did not say what `true` means. 21 new enum types over 37 components.
#
# Every enum parameter is also typed `ClassValues<T>` rather than `T`. No call site changes —
# `size = ButtonSize.Lg` reads as before, because the enum IS a ClassValues — and the wider
# type is what will later let one parameter take a class applied at a Tailwind breakpoint.
#
# That composition is built and deliberately NOT public. Measured 2026-09-13: a composed class
# reaches no CSS, because Tailwind emits per candidate STRING found while scanning files as
# text and a class assembled at run time appears in no file. Publishing it would hand callers
# a class attribute that silently styles nothing. Apply a variant as a literal through
# `extraClasses` until a build-time extractor lands — openspec/changes/extract-used-classes-from-bytecode.
#
# Pre-1.0, so a breaking change still travels in a minor; see "How to migrate from 0.5.x" in
# README.md. The compiler finds every call site this time, which 0.4.x's otp change did not.
version=0.6.0
