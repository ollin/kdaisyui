# Dependency, plugin, tooling, and submodule versions live in gradle/libs.versions.toml.
#
# This is the version for LOCAL builds and publishToMavenLocal, and the intent for the next
# release. It does NOT drive a release: .github/workflows/release.yml triggers on a v* tag
# and passes -Pversion derived from that tag name, which overrides this value. The tag is the
# source of truth, this line is the declaration of intent — which is why v0.1.1 and v0.1.2
# shipped while this file still read 0.1.0.
#
# 0.7.0 repairs three defects a consumer found upgrading from 0.1.2 to 0.6.0, and two of the
# repairs break: the first at COMPILE TIME, the second at compile time for Ktor Resources and as
# a 404 for a webjar a consumer relied on without declaring:
#
#   - daisyDropdown dropped end/start/center/top/bottom. 0.6.0 said its placement enums
#     REPLACED them, and they were still there beside the enums. The generator now refuses to
#     run while any function offers one class both as a boolean and as an enum constant.
#   - kdaisyui-ktor-integration exports neither Ktor nor any webjar. As `api` dependencies they
#     won Gradle's conflict resolution and moved a consumer from htmx 2.x to 4.x silently.
#   - llms.txt, which README points AI tools at, is generated and drift-checked. It had still
#     documented the 0.1.x API.
#
# Pre-1.0, so a breaking change still travels in a minor; see "How to migrate from 0.6.x" in
# README.md.
version=0.7.0
