name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run unit tests and enforce coverage gate
        # koverVerify is the aggregated 100% gate — keep it here so CI fails on a
        # coverage shortfall; reverting this to a bare :lib:test silently disables it.
        run: ./gradlew :lib:test koverVerify koverXmlReport --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: lib/build/reports/tests/test/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/kover/
          retention-days: 7

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Playwright browsers
        run: ./gradlew :e2e-tests:playwrightInstall --no-daemon

      - name: Run E2E tests
        run: ./gradlew :e2e-tests:test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-report
          path: e2e-tests/build/reports/tests/test/
          retention-days: 7
