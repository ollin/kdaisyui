# DaisyUI base version — SINGLE SOURCE OF TRUTH.
# One number drives three things, so they cannot drift apart:
#   1. the daisyui submodule tag checked out by :lib:checkoutDaisyuiTag  (v<version>)
#   2. the codegen input every component is generated from
#   3. the org.webjars.npm:daisyui CSS served by :example-app
# Kept current by the customManager in renovate.json (never automerged — a bump
# regenerates every component).
#
# UPPER BOUND: 5.5.20 — three independent ceilings, the lowest wins.
#   git tags reach ......... v5.7.4
#   webjars published up to . 5.7.0  (only a subset of releases gets a webjar)
#   codegen input up to ..... 5.5.22
#
# The codegen ceiling is the binding one: DaisyUI deleted the static
# packages/docs/static/llms.txt in commit f00802cc (2026-05-21) and replaced it
# with a generated SvelteKit route (packages/docs/src/routes/llms.txt/+server.js).
# First release without the file is 5.5.23. codegen/src/parser/llms-txt.js reads
# that static path and fails with ENOENT without it.
#
# Raising this past 5.5.20 requires reworking the codegen parser FIRST.
daisyui.version=5.5.20

# Heroicons base version — drives :lib:checkoutHeroiconsTag and the icon codegen.
heroicons.version=2.2.0

# Project version: <daisyui.version>-<local revision>. SNAPSHOT for local builds,
# overridden on publish with -Pversion.
version=5.5.20-SNAPSHOT

# Kotlin: this value wins. The IDE classpath may resolve a newer Kotlin (2.3.20/2.3.21)
# from the toolchain — that drift is cosmetic, the build uses the value below.
versions.kotlin=2.3.10
versions.kotlinx-html=0.12.0
versions.ktor=3.5.0

versions.webjar-locator-core=0.59