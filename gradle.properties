# Dependency, plugin, tooling, and submodule versions live in gradle/libs.versions.toml.
#
# This is the version for LOCAL builds and publishToMavenLocal, and the intent for the next
# release. It does NOT drive a release: .github/workflows/release.yml triggers on a v* tag
# and passes -Pversion derived from that tag name, which overrides this value. The tag is the
# source of truth, this line is the declaration of intent — which is why v0.1.1 and v0.1.2
# shipped while this file still read 0.1.0.
#
# 0.5.0 stops the generator asserting things it can check. Four functions break:
# daisyFileInput, daisyThemeController and daisyMask lose their content lambda (they render
# void elements, so its body could never legally render), and daisyOtp renders the <label>
# DaisyUI documents instead of a <div>.
#
# That last one is the same shape as 0.4.0's megamenu break and the same blind spot: a changed
# lambda receiver leaves lib/api/lib.api untouched, because both types erase to Function1 —
# and this time even the hand-written example app still compiled. Hence lib/api/components.api,
# a second baseline carrying receiver types, parameter names and defaults, checked in CI.
#
# Pre-1.0, so a breaking change still travels in a minor; see "How to migrate from 0.4.x" in
# README.md, and read it rather than trusting the compiler — the otp change can compile silently.
version=0.5.0
