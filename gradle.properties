# Dependency, plugin, tooling, and submodule versions live in gradle/libs.versions.toml.
#
# This is the version for LOCAL builds and publishToMavenLocal, and the intent for the next
# release. It does NOT drive a release: .github/workflows/release.yml triggers on a v* tag
# and passes -Pversion derived from that tag name, which overrides this value. The tag is the
# source of truth, this line is the declaration of intent — which is why v0.1.1 and v0.1.2
# shipped while this file still read 0.1.0.
#
# 0.8.0 makes every element DaisyUI documents generatable, and checks it. It breaks at COMPILE
# TIME almost everywhere, on purpose, and in one place silently:
#
#   - the component API is declared in codegen/model/ instead of inferred from DaisyUI's docs;
#     every name follows one rule (variant becomes color, boolean groups become one axis each).
#     daisyTab { } still compiles and now renders an item, not the bar: the one silent break.
#   - every function gets a class sibling, Tag.daisy<Name>Classes, for two components on one
#     element and for a component's classes on an element you write yourself; parameters that
#     wrote their class on a container, where DaisyUI's CSS has no effect, moved to the child.
#   - every $$-marked element of DaisyUI's examples is a generated test, on DaisyUI's own tag;
#     daisyCalendar renders <calendar-date>, the web component cally styles.
#
# Pre-1.0, so a breaking change still travels in a minor; see "How to migrate from 0.7.x" in
# README.md.
version=0.8.0
