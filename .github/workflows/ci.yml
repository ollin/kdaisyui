name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Keeps the committed lib/generated honest. Before this job existed the build
  # itself regenerated on every compile, so drift was impossible; now that the
  # build reads committed sources instead, this is what replaces that guarantee.
  # It is the only job that needs Node and the git submodules.
  generated-sources-drift:
    name: generated-sources-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Regenerate
        run: ./gradlew :lib:generateComponents :lib:generateComponentTests :lib:generateHeroicons :lib:generateHeroiconTests --no-daemon

      - name: Fail if the committed sources no longer match their inputs
        run: |
          # --porcelain also reports untracked files, so a newly added component
          # counts as drift rather than slipping through as "no diff".
          if [ -n "$(git status --porcelain -- lib/generated)" ]; then
            echo "::error::lib/generated does not match what the generators produce."
            echo "Run 'just generate' and commit the result."
            echo
            git --no-pager diff --stat -- lib/generated
            git status --porcelain -- lib/generated
            exit 1
          fi
          echo "lib/generated matches its inputs."

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      # No submodules: the generated sources are committed and the build does not
      # run the generators. If this job ever needs them again, that is a defect -
      # the drift job is what owns regeneration.
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run unit tests and enforce coverage gate
        # koverVerify is the aggregated 100% gate — keep it here so CI fails on a
        # coverage shortfall; reverting this to a bare :lib:test silently disables it.
        run: ./gradlew :lib:test koverVerify koverXmlReport --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: lib/build/reports/tests/test/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/kover/
          retention-days: 7

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    steps:
      # No submodules — see unit-tests.
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Playwright browsers
        run: ./gradlew :e2e-tests:playwrightInstall --no-daemon

      - name: Run E2E tests
        run: ./gradlew :e2e-tests:test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-report
          path: e2e-tests/build/reports/tests/test/
          retention-days: 7
