# Dependency, plugin, tooling, and submodule versions live in gradle/libs.versions.toml.
#
# This is the version for LOCAL builds and publishToMavenLocal, and the intent for the next
# release. It does NOT drive a release: .github/workflows/release.yml triggers on a v* tag
# and passes -Pversion derived from that tag name, which overrides this value. The tag is the
# source of truth, this line is the declaration of intent — which is why v0.1.1 and v0.1.2
# shipped while this file still read 0.1.0.
#
# 0.3.0 ships kdaisyui-classes.txt in the jar. The public API is unchanged, but consumers are
# told to extract a file that exists only from this version — so a minor, not a patch.
version=0.3.0
