name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A newer push to a pull request cancels its older run; every push to main is its own group, so a
# merge never cancels the previous merge's run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs this pull request can affect (openspec/specs/ci-job-selection/spec.md). Every test
  # job below needs it and runs when its group's output is 'true' OR when this job did not
  # succeed: a skipped job satisfies a required check, so a broken classifier must run
  # everything, never nothing. Jobs are skipped by their own `if`, never by an `on:` path filter,
  # which would leave the required checks pending.
  #
  #   none   only planning and agent files     no test job
  #   prose  plus prose documentation          unit-tests, generated-sources-drift
  #   full   anything else, and every push     all six
  #
  # A new test job gets `needs: scope` and the condition of its group, or it simply runs always.
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      prose-jobs: ${{ steps.classify.outputs.prose-jobs }}
      full-jobs: ${{ steps.classify.outputs.full-jobs }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, the base branch: HEAD^1..HEAD is exactly what
          # the pull request changes (verified on PR #439).
          fetch-depth: 2

      - name: Prove the classifier's rules on fixed paths
        run: bash .github/ci-scope/classify.test.sh

      - name: Classify the changed files
        id: classify
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"; then
            printf '%s\n' "$changed"
            scope="$(printf '%s\n' "$changed" | bash .github/ci-scope/classify.sh)"
          else
            scope=full
          fi
          echo "scope: $scope"
          [ "$scope" = none ] && echo "prose-jobs=false" >> "$GITHUB_OUTPUT" || echo "prose-jobs=true" >> "$GITHUB_OUTPUT"
          [ "$scope" = full ] && echo "full-jobs=true" >> "$GITHUB_OUTPUT" || echo "full-jobs=false" >> "$GITHUB_OUTPUT"

  # Keeps the committed lib/generated and docs/reference honest. Before this job
  # existed the build itself regenerated on every compile, so drift was impossible;
  # now that the build reads committed sources instead, this is what replaces that
  # guarantee. It is the only job that needs Node and the git submodules.
  #
  # Every generator belongs here. A generator missing from this job is worse than
  # one that does not exist, because the committed tree then drifts in silence: a
  # stale input path in test-generator.ts once removed 66 coverage files and 8% line
  # coverage while every build stayed green. docs/reference was outside this job
  # until now, and it cost the same way with a slower fuse — megamenu.md documented
  # a DIV lambda receiver for five days after the element became a <span>, and
  # shipped wrong in v0.4.0. llms.txt joined in 0.7.0 after a release in which it
  # still documented the 0.1.x API that README pointed AI tools at.
  generated-sources-drift:
    name: generated-sources-drift
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.prose-jobs == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS
          cache: gradle

      # This job ran the generators on whatever Node the runner happened to ship, which was
      # tolerable while they only executed a script. Since 2026-09-12 the Gradle tasks also
      # run `npm ci`, so the npm version decides how a lockfile is installed — and the note
      # on the codegen-tests job applies here too: a Node mismatch is not loud. Both
      # Node-running jobs now read the same pin.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: codegen/package-lock.json

      # `:lib:generateComponents` also runs the element cross-check: every class a generated
      # function emits, against the element DaisyUI documents it on, with a recorded exception
      # list that expires on its own. A disagreement fails this step, so there is no separate
      # step for it — and none should be added, because the check needs the generator's own
      # shape model to know which function emits which class. Beside the drift check rather
      # than in `check`, for the same reason the generators are: it reads the submodule.
      - name: Regenerate
        run: ./gradlew :lib:generateComponents :lib:generateComponentTests :lib:generateHeroicons :lib:generateHeroiconTests :lib:generateReferenceDocs --no-daemon

      # Beside the drift check rather than in `check`, for the same reason the generators are:
      # it reads the submodule and runs Node, and a clone must compile and test with neither.
      #
      # A separate step from the drift check, not folded into it, because the two answer
      # different questions. Drift asks whether the committed output matches its inputs;
      # this asks whether the Kotlin API changed — and the API baseline is updated by an
      # explicit task, so a change here is meant to fail until a human has read the diff.
      - name: Fail if the components' Kotlin API no longer matches its baseline
        run: ./gradlew :lib:checkComponentApi --no-daemon

      - name: Fail if the committed sources no longer match their inputs
        run: |
          # --porcelain also reports untracked files, so a newly added component
          # counts as drift rather than slipping through as "no diff". It also
          # reports deletions, which is what catches a page the generator no longer
          # produces.
          if [ -n "$(git status --porcelain -- lib/generated docs/reference llms.txt llms-full.txt)" ]; then
            echo "::error::lib/generated, docs/reference, llms.txt or llms-full.txt does not match what the generators produce."
            echo "Run 'just generate' and commit the result."
            echo
            git --no-pager diff --stat -- lib/generated docs/reference llms.txt llms-full.txt
            git status --porcelain -- lib/generated docs/reference llms.txt llms-full.txt
            exit 1
          fi
          echo "lib/generated, docs/reference, llms.txt and llms-full.txt match their inputs."

  # The codegen's own unit tests. Deliberately not part of `./gradlew check`: AGENTS.md
  # promises a clone builds and tests with no Node, so anything needing Node lives in its
  # own job. This and generated-sources-drift are the only two.
  #
  # Neither submodules nor a JDK, unlike its sibling. These tests import the generator
  # modules and assert on pure functions — nothing reads the DaisyUI or Heroicons
  # checkouts, nothing compiles Kotlin. If this job ever needs either, that is the signal
  # that the tests have drifted into integration territory which generated-sources-drift
  # already covers end to end.
  #
  # It does need `npm ci` since 2026-09-12: the modules under test parse DaisyUI's documented
  # markup with a real HTML parser. That is a dependency on a package, not on a checkout, so
  # the rule above is intact — these tests still read no submodule.
  codegen-tests:
    name: codegen-tests
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full-jobs == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD and its first parent, for the mutation step's diff: on a pull request the merge
          # commit and the base, on main the merge and the previous main.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Read from .tool-versions so the pinned version has exactly one home. A second
          # copy here would drift, and a Node mismatch is not loud: the test runner's
          # default file patterns have changed between majors.
          node-version-file: .tool-versions
          # Cache keyed on the lockfile, which only exists because the codegen has a
          # dependency now. Without the path, the action looks for a lockfile at the
          # repository root and there is none.
          cache: npm
          cache-dependency-path: codegen/package-lock.json

      - name: Install codegen dependencies
        working-directory: codegen
        run: npm ci

      - name: Run codegen unit tests
        working-directory: codegen
        run: npm test

      # The lines this change adds under codegen/src, mutated by StrykerJS; a single survivor
      # fails the job (mutation-testing, "Changed codegen lines are mutation-tested at 100 %").
      # Only those lines: the whole directory scored 43.7 % when the gate was introduced. The
      # threshold is `thresholds.break: 100` in codegen/stryker.config.json. An equivalent mutant
      # is answered by deleting the code or by a `// Stryker disable next-line <mutator>:
      # <reason>` comment a reviewer can check, never by lowering the threshold.
      #
      # The config's command runs each mutant's suite with `--test-isolation=none`: one Node
      # process per test file made 54 mutants take 77 s here, one process overall 81 in 13 s.
      - name: Mutation-test the changed lines of codegen/src
        working-directory: codegen
        run: |
          ranges="$(node src/index-mutation-scope.ts)"
          if [ -z "$ranges" ]; then
            echo "No added line under codegen/src: nothing to mutate."
            exit 0
          fi
          echo "$ranges" | tr ',' '\n'
          npx stryker run --mutate "$ranges"

      - name: Upload mutation report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: codegen-mutation-report
          path: codegen/reports/mutation/
          retention-days: 7

  # The sibling of generated-sources-drift: both compare a committed artefact
  # against what the build produces. Kept separate from unit-tests so an API
  # change and a failing test are distinguishable in the checks list - and so
  # this gate cannot be lost inside another job's task list. It needs no
  # submodules; the ABI comes from the committed sources.
  api-baseline:
    name: api-baseline
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full-jobs == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS
          cache: gradle

      - name: Fail if the public API no longer matches its baseline
        # Run `./gradlew :lib:updateKotlinAbi` and commit lib/api/lib.api when the
        # change is intended. A breaking change also needs a "How to migrate"
        # entry in docs/upgrading.md before the release that ships it.
        run: ./gradlew :lib:checkKotlinAbi --no-daemon

  unit-tests:
    name: unit-tests
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.prose-jobs == 'true') }}
    runs-on: ubuntu-latest
    steps:
      # No submodules: the generated sources are committed and the build does not
      # run the generators. If this job ever needs them again, that is a defect -
      # the drift job is what owns regeneration.
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS
          cache: gradle

      - name: Run check, without the browser tests
        # `check`, not a list of its tasks: a list is what let a task `check` depends on
        # reach no CI job (the documentation snippets, until 2026-10-31). Whatever `check`
        # gains now runs here by default. It includes koverVerify, the aggregated 100%
        # gate, and compiles the example app's stylesheet in Docker, which the runner has.
        # Only the E2E suite is left to its own job, which installs Chromium.
        run: ./gradlew check -x :e2e-tests:test koverXmlReport --no-daemon

      - name: No Gradle problem beyond the accepted ones
        # Reads the problems report the step above wrote, which no task of that build can read
        # itself. The accepted problems, each with its reason: gradle/allowed-gradle-problems.txt.
        run: ./gradlew :build-checks:checkGradleProblems --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: lib/build/reports/tests/test/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/kover/
          retention-days: 7

  # Asks the question coverage cannot: were the executed lines actually ASSERTED. The pair
  # is deliberate — unit-tests enforces Kover at 100% line and branch, this enforces PIT at
  # 100% test strength, and neither implies the other.
  #
  # Its own job rather than a step in unit-tests, for the same reason api-baseline is
  # separate: a failing assertion and a surviving mutant are different problems and should
  # be distinguishable in the checks list. It also forks a JVM per mutant, so it has no
  # business in the inner loop or in `./gradlew check`.
  #
  # No submodules — it builds from the committed generated sources like everything except
  # the drift job.
  mutation-tests:
    name: mutation-tests
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full-jobs == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS
          cache: gradle

      - name: Run mutation tests and enforce the test-strength gate
        # testStrengthThreshold = 100 lives in lib/build.gradle.kts, next to the reasoning
        # for why it is test strength and not mutation score, and in
        # doc-snippets/build.gradle.kts for the documentation extractor. Do not move the
        # number here.
        run: ./gradlew :lib:pitest :doc-snippets:pitest :build-checks:pitest :gradle-plugin:pitest --no-daemon

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: |
            lib/build/reports/pitest/
            doc-snippets/build/reports/pitest/
            build-checks/build/reports/pitest/
            gradle-plugin/build/reports/pitest/
          retention-days: 7

  e2e-tests:
    name: e2e-tests
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full-jobs == 'true') }}
    runs-on: ubuntu-latest
    steps:
      # No submodules — see unit-tests.
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS
          cache: gradle

      - name: Install Playwright browsers
        run: ./gradlew :e2e-tests:playwrightInstall --no-daemon

      - name: Run E2E tests
        run: ./gradlew :e2e-tests:test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-report
          path: e2e-tests/build/reports/tests/test/
          retention-days: 7
